name: GardenCore
version: '${project.version}'
main: com.herasgarden.gardencore.GardenCore
api-version: '26.2'
author: Hera's Garden
website: https://herasgarden.net
description: Shared platform systems for The Garden SMP, including Obols, claims, organizations, storage, and integrations.
depend: [Vault]
softdepend: [Essentials, WorldGuard, MarriageMaster]

commands:
  obol:
    description: Manage your Obol balance and physical Obols.
    usage: /obol <balance|withdraw|deposit|admin>
    permission: gardencore.obol
  garden:
    description: GardenCore commands.
    usage: /garden <claim|company>
    aliases: [gc]
  claim:
    description: Create and manage GardenCore claims without typing /garden.
    usage: /claim <start|confirm|cancel|undo|edit|preview|settings|height|territory|tag|blocks|buyblocks|info|delete>
  company:
    description: Manage GardenCore companies without typing /garden.
    usage: /company <create|info|list>
  adminclaim:
    description: Quickly create and manage administrator land claims.
    usage: /adminclaim <start|info|settings|delete>
    permission: gardencore.claim.admin
  horse:
    description: Manage who may ride your tamed horse.
    usage: /horse <info|access|trust|untrust>

permissions:
  gardencore.obol:
    description: Use Obol banking commands.
    default: true
  gardencore.obol.admin:
    description: Add or remove Obols from player balances.
    default: op
  gardencore.claim:
    description: Create and manage personal claims.
    default: true
  gardencore.claim.territory:
    description: Directly create territory claims during development/testing.
    default: op
  gardencore.claim.admin:
    description: Bypass GardenCore claim restrictions and manage all claims.
    default: op
  gardencore.company.create:
    description: Create a GardenCore company.
    default: true

  gardencore.horse.admin:
    description: Manage horse access on any tamed horse.
    default: op
